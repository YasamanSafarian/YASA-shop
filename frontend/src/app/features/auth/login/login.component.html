<section class="auth">
  <div class="container auth__inner">
    <div class="auth__card">
      <p class="eyebrow">{{ translate.t('login.eyebrow') }}</p>
      <h1 class="auth__title">{{ translate.t('login.title') }}</h1>
      <p class="auth__lead">{{ translate.t('login.lead') }}</p>

      @if (errorMessage()) {
        <app-ui-alert [message]="errorMessage()" />
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <app-ui-input
          id="identifier"
          type="text"
          formControlName="identifier"
          autocomplete="username"
          [label]="translate.t('login.identifierLabel')"
          [placeholder]="translate.t('login.identifierPlaceholder')"
          [error]="identifier.invalid && identifier.touched ? translate.t('login.identifierError') : null"
        />

        <app-ui-input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [label]="translate.t('login.passwordLabel')"
          [placeholder]="translate.t('login.passwordPlaceholder')"
          [error]="password.invalid && password.touched ? translate.t('login.passwordError') : null"
        />

        <app-ui-button
          type="submit"
          [block]="true"
          size="lg"
          [disabled]="submitting()"
        >
          {{ submitting() ? translate.t('login.submitting') : translate.t('login.submit') }}
        </app-ui-button>
      </form>

      <p class="auth__footer">
        {{ translate.t('login.newTo') }}
        <a routerLink="/register" class="link">{{ translate.t('login.createAccount') }}</a>
      </p>
    </div>
  </div>
</section>
