@if (alertService.alerts().length > 0) {
  <div class="alert-container" aria-live="polite">
    @for (alert of alertService.alerts(); track alert.id) {
      <div class="alert alert--{{ alert.type }}" role="alert">
        <svg class="alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="iconPath(alert.type)" />
        </svg>
        <span class="alert__message">{{ alert.message }}</span>
        <button type="button" class="alert__close" (click)="alertService.dismiss(alert.id)" aria-label="Dismiss">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    }
  </div>
}
