<div class="stepper">
  @for (step of steps(); track step.label; let i = $index; let last = $last) {
    <div
      class="stepper__step"
      [class.is-completed]="i < currentStep()"
      [class.is-active]="i === currentStep()"
      [class.is-pending]="i > currentStep()"
    >
      <div class="stepper__indicator">
        <div class="stepper__circle">
          @if (i < currentStep()) {
            <svg class="stepper__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          } @else {
            <span class="stepper__number">{{ i + 1 }}</span>
          }
        </div>
        @if (!last) {
          <div class="stepper__line"></div>
        }
      </div>
      <span class="stepper__label">{{ step.label }}</span>
    </div>
  }
</div>
