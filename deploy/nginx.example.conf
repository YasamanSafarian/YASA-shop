# YASA — example site config for a reverse proxy (nginx) on the VPS.
# Adapt: server_name, path to the frontend dist, path to the backend uploads.
#
# The product images work exactly like category images here:
# nginx serves them as static files (no proxying).

server {
    listen 80;
    server_name theyasa.ir www.theyasa.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name theyasa.ir www.theyasa.ir;

    # Let's Encrypt (adjust paths if you used certbot)
    ssl_certificate     /etc/letsencrypt/live/theyasa.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theyasa.ir/privkey.pem;

    root /home/ubuntu/YASA-shop/frontend/dist/frontend/browser;
    index index.html;

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: /api/products -> backend /products (strip the /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Uploaded product images — served statically like /assets
    location /uploads/ {
        alias /home/ubuntu/YASA-shop/backend/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Cacheable built assets
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}